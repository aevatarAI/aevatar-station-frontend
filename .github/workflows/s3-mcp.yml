name: Deploy Aevatar Station MCP Client to Testnet

on:
  push:
    branches: ["deploy/tool-test"]

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - run: pnpm install
      - name: create env file
        run: |
          touch .env
          echo VITE_APP_NETWORKTYPE=TESTNET >> .env
          echo VITE_APP_SUPPORT_CONFIG_URL=1 >> .env
          echo VITE_APP_DEFAULT_SERVER_URL=https://aevatar-station-mcp-staging.aevatar.ai >> .env
          echo VITE_GITHUB_CLIENT_ID=${{ secrets.VITE_GITHUB_CLIENT_ID }} >> .env
          echo VITE_GITHUB_CLIENT_SECRET=${{ secrets.VITE_GITHUB_CLIENT_SECRET }} >> .env
          echo VITE_GITHUB_REDIRECT_URI=${{ secrets.VITE_GITHUB_REDIRECT_URI }} >> .env
          echo VITE_GITHUB_SCOPE=${{ secrets.VITE_GITHUB_SCOPE }} >> .env
          echo VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} >> .env
      - run: pnpm build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_MCP_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_MCP_STAGING }}
          aws-region: ap-northeast-1

      - name: Sync to S3
        run: aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET_MCP_STAGING }}
